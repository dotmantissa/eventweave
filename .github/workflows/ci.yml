name: Verify EventWeave
on:
  push:
  pull_request:
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: npm run setup
        env:
          VITE_PRIVY_APP_ID: public_build_configuration
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
        env:
          VITE_PRIVY_APP_ID: public_build_configuration
      - run: npm test
      - run: node scripts/python.mjs -m pytest tests/validator -q --junitxml=verification/ci-validator.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-verification
          path: verification/ci-*
